name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: npm ci
      - run: npm --prefix client ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm --prefix client test -- --watchAll=false --passWithNoTests
